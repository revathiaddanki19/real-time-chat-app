<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Chat - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;

            margin-top: 25px;

            border: none;
            border-radius: 6px;

            background: #333;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your chat account
        </p>


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div id="message"></div>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();


            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");


            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    // Save login information
                    localStorage.setItem(
                        "token",
                        data.token
                    );

                    localStorage.setItem(
                        "userId",
                        data.user.id
                    );

                    localStorage.setItem(
                        "username",
                        data.user.username
                    );


                    message.style.color = "green";

                    message.textContent =
                        "Login successful!";


                    // Open chat page
                    setTimeout(() => {

                        window.location.href =
                            "chat.html";

                    }, 1000);

                } else {

                    message.style.color = "red";

                    message.textContent =
                        data.message;

                }

            } catch (error) {

                console.log(error);

                message.style.color = "red";

                message.textContent =
                    "Unable to connect to server.";

            }

        });

    </script>

</body>

</html>
